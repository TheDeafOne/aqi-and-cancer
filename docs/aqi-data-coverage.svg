<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AQI records in the included annual files</title>
  <desc id="desc">Source inventory: 2016 has 1030 rows, 2017 has 1029, 2018 has 1021, 2019 has 1020, and 2020 has 1003. Counts show reporting records in the annual AQI files.</desc>
  <rect width="1200" height="420" fill="#f8f7f3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="50" font-size="16" letter-spacing="2" fill="#356a70">AIR QUALITY AND CANCER</text>
    <text x="48" y="99" font-size="32" font-weight="700" fill="#17383d">Five years of county AQI records</text>
    <text x="48" y="134" font-size="18" fill="#50686c">Number of rows in each annual source file, before joining to cancer or geography data.</text>
    <path d="M145 210 H1055" stroke="#9bb4b7" stroke-width="3"/>
    <g text-anchor="middle">
      <g transform="translate(48 174)">
        <rect width="204" height="144" rx="12" fill="#e2efee" stroke="#bdd4d2"/>
        <text x="102" y="36" font-size="20" fill="#356a70">2016</text>
        <text x="102" y="88" font-size="38" font-weight="700" fill="#17383d">1,030</text>
        <text x="102" y="119" font-size="16" fill="#50686c">AQI records</text>
      </g>
      <g transform="translate(273 174)">
        <rect width="204" height="144" rx="12" fill="#e2efee" stroke="#bdd4d2"/>
        <text x="102" y="36" font-size="20" fill="#356a70">2017</text>
        <text x="102" y="88" font-size="38" font-weight="700" fill="#17383d">1,029</text>
        <text x="102" y="119" font-size="16" fill="#50686c">AQI records</text>
      </g>
      <g transform="translate(498 174)">
        <rect width="204" height="144" rx="12" fill="#e2efee" stroke="#bdd4d2"/>
        <text x="102" y="36" font-size="20" fill="#356a70">2018</text>
        <text x="102" y="88" font-size="38" font-weight="700" fill="#17383d">1,021</text>
        <text x="102" y="119" font-size="16" fill="#50686c">AQI records</text>
      </g>
      <g transform="translate(723 174)">
        <rect width="204" height="144" rx="12" fill="#e2efee" stroke="#bdd4d2"/>
        <text x="102" y="36" font-size="20" fill="#356a70">2019</text>
        <text x="102" y="88" font-size="38" font-weight="700" fill="#17383d">1,020</text>
        <text x="102" y="119" font-size="16" fill="#50686c">AQI records</text>
      </g>
      <g transform="translate(948 174)">
        <rect width="204" height="144" rx="12" fill="#e2efee" stroke="#bdd4d2"/>
        <text x="102" y="36" font-size="20" fill="#356a70">2020</text>
        <text x="102" y="88" font-size="38" font-weight="700" fill="#17383d">1,003</text>
        <text x="102" y="119" font-size="16" fill="#50686c">AQI records</text>
      </g>
    </g>
    <text x="48" y="365" font-size="17" fill="#50686c">Source: data/annual_aqi_by_county_2016.csv through annual_aqi_by_county_2020.csv.</text>
    <text x="48" y="393" font-size="16" fill="#50686c">Annual files include AQI summaries, observation counts, and pollutant-day totals.</text>
  </g>
</svg>
